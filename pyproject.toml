[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spamshield-naive-bayes"
version = "2.0.0"
description = "From-scratch Multinomial Naive Bayes spam classification on the full SpamAssassin corpus sample."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]
